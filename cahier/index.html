:root {
  color-scheme: light;
  --navy: #0b1d48; --navy2: #16306b; --navy3: #243f80;
  --gold: #c39a2e; --gold-ink: #8a6a12; --gold-soft: #f7efd8;
  --bg: #eef2f8; --card: #fff; --card2: #f6f8fc;
  --ink: #0f1b33; --ink2: #3f4b63; --soft: #6b7790; --line: #dbe2ee; --line2: #c5cfe0;
  --p: #2e7d32; --p-bg: #e4f3e5;
  --e: #2b6cb8; --e-bg: #e2edf9;
  --b: #c62828; --b-bg: #fbe6e6;
  --a: #b35f00; --a-bg: #fdeeda;
  --n: #6b7790; --n-bg: #edf0f5;
  --field: #24613f; --field2: #1d5335;
  --disp: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  --lab: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ---------- structure ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 8px) 16px 8px; background: var(--navy); color: #fff; }
.top img { width: 34px; height: 34px; object-fit: contain; flex: none; }
.top-t { flex: 1; min-width: 0; }
.top-t b { display: block; font: 400 23px/1 var(--disp); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-t span { display: block; font: 600 13px/1.2 var(--lab); letter-spacing: .04em; color: #b9c8e6; }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 12px; color: inherit; }
.icon-btn:hover { background: rgba(255,255,255,.12); }
.icon-btn svg, .nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
main { display: block; max-width: 1180px; margin: 0 auto; padding: 16px 16px calc(92px + var(--sab)); }
.nav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: var(--sab); background: var(--navy); }
.nav a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; font: 600 13px/1.1 var(--lab); letter-spacing: .03em; color: #b9c8e6; }
.nav a[aria-current="page"] { color: #fff; box-shadow: inset 0 3px 0 var(--gold); }
.nav a:hover { color: #fff; }

/* ---------- éléments communs ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.card + .card { margin-top: 12px; }
.h-page { font: 400 32px/1.05 var(--disp); letter-spacing: .02em; color: var(--navy); }
.h-sub { font: 500 15px/1.3 var(--body); color: var(--soft); }
.h-sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 10px; font: 700 15px/1.2 var(--lab); letter-spacing: .07em; text-transform: uppercase; color: var(--navy2); }
.h-sec small { font: 500 14px/1.2 var(--body); letter-spacing: 0; text-transform: none; color: var(--soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line2); background: #fff; font: 600 16px/1.1 var(--lab); letter-spacing: .02em; color: var(--navy); }
.btn:hover { background: var(--card2); border-color: var(--navy3); }
.btn.pri { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.pri:hover { background: var(--navy2); }
.btn.dng { color: var(--b); border-color: #e6b4b4; }
.btn.dng:hover { background: var(--b-bg); border-color: var(--b); }
.btn.sm { min-height: 36px; padding: 5px 10px; font-size: 15px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font: 700 13px/1.45 var(--lab); letter-spacing: .03em; white-space: nowrap; background: var(--n-bg); color: var(--n); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-P { background: var(--p-bg); color: var(--p); } .s-E { background: var(--e-bg); color: var(--e); }
.s-B { background: var(--b-bg); color: var(--b); } .s-A { background: var(--a-bg); color: var(--a); }
.empty { padding: 26px 16px; text-align: center; color: var(--soft); }
.empty b { display: block; margin-bottom: 4px; font: 400 22px/1.1 var(--disp); letter-spacing: .02em; color: var(--navy); }
.empty .acts { justify-content: center; margin-top: 14px; }
.note { padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); color: #5e4a10; font-size: 14px; }
.alert { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--b-bg); color: #8f1d1d; font-size: 14px; font-weight: 500; }
.alert + .alert { margin-top: 6px; }
.alert.e { background: var(--e-bg); color: #1d4f8a; }
.alert.a { background: var(--a-bg); color: #7c4300; }
.alert b { font-weight: 600; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: #dfe5f0; }
.seg button { flex: 1; min-height: 38px; padding: 5px 8px; border-radius: 8px; font: 600 16px/1.1 var(--lab); letter-spacing: .02em; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 2px rgba(11,29,72,.18); }

/* ---------- accueil ---------- */
.dash { display: grid; gap: 12px; }
.dash .col { display: grid; gap: 12px; min-width: 0; }
.dash .card { margin: 0; }
.dash > .card { margin: 0; }
.hello { margin-bottom: 14px; }
.match-card { background: linear-gradient(150deg, var(--navy) 0%, var(--navy2) 100%); border: 0; color: #fff; display: block; width: 100%; text-align: left; }
.match-card .h-sec { color: #d9c47f; }
.match-card .h-sec small { color: #b9c8e6; }
.match-t { font: 400 34px/1 var(--disp); letter-spacing: .02em; }

/* présences */

.call { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); }

function compoTexte(m) {
  const l = [`${m.j} · ${titreM(m)}`, [m.date ? cap(dateLong(m.date)) : '', m.heure, m.lieu].filter(Boolean).join(' · '), ''];
  const seq = n => m.tit[n] ? `${n}. ${nomC(m.tit[n])}` : `${n}. —`;
  LIGNES.forEach(r => l.push(r.map(seq).join('  ')));
  const rem = Object.keys(m.rem).sort((a, b) => a - b).map(n => `${n}. ${nomC(m.rem[n])}`);
  if (rem.length) l.push('', 'Entrants : ' + rem.join(', '));
  if (m.cap) l.push('', 'Capitaine : ' + nomC(m.cap));
  return l.join('\n');
}

/* ---------- sélection d'un joueur ---------- */
let CTX = null;
function ctxPos() {
  if (CTX.k === 'compo') { const m = match(CTX.id); return { ...m.tit, ...m.rem }; }
  return jour(CTX.d).equipes[CTX.i].pos;
}
function ctxMap() {
  if (CTX.k === 'compo') return etatAu(statDate(match(CTX.id))).map;
  return (appel(CTX.d) ? { map: appel(CTX.d) } : etatAu(CTX.d)).map;
}
function openPicker() {
  const n = CTX.n, pos = ctxPos(), map = ctxMap(), cur = pos[n];
  const numDe = {}; Object.entries(pos).forEach(([k, v]) => { numDe[v] = k; });
  if (CTX.k === 'eq') jour(CTX.d).equipes.forEach((e, i) => { if (i !== CTX.i) Object.entries(e.pos).forEach(([k, v]) => { numDe[v] = `${k} ${e.couleur}`; }); });
  const ordre = { P: 0, E: 1, A: 2, B: 3 };
  const tri = (a, b) => ((ordre[map[a.id]] ?? 4) - (ordre[map[b.id]] ?? 4)) || a.postes[0] - b.postes[0] || a.nom.localeCompare(b.nom, 'fr');
  const fam = n <= 15 ? FAMILLES[n] : [];
  const auPoste = JOUEURS.filter(p => p.postes.some(x => fam.includes(x))).sort(tri);
  const autres = JOUEURS.filter(p => !p.postes.some(x => fam.includes(x))).sort(tri);
  const row = p => `<button class="pick ${p.id === cur ? 'cur' : ''}" data-a="pick" data-id="${esc(p.id)}" data-q="${esc(p.nom.toLowerCase())}"><span class="nm">${esc(nomL(p.id))}<br><small>${esc(role(p.postes[0]))}${minutes(p.id) ? ' · ' + minutes(p.id) + ' min joués' : ''}${numDe[p.id] && p.id !== cur ? ` · déjà n°${esc(numDe[p.id])}` : ''}</small></span>${pill(map[p.id])}</button>`;
  openDlg(`<div class="dg-h"><h2>N°${n}<small>${n <= 15 ? esc(role(n)) : 'Entrant'}${cur ? ' · ' + esc(nomL(cur)) : ''}</small></h2><button class="icon-btn" data-a="dlg-close" aria-label="Fermer">${ICO.x}</button></div>
    <div class="dg-b">
      <label class="f"><span>Chercher</span><input type="search" id="pick-q" placeholder="Nom du joueur"></label>
      ${cur ? '<div class="acts" style="margin-top:8px"><button class="btn sm dng" data-a="pick" data-id="">Retirer ce joueur</button></div>' : ''}
      <div id="pick-list">
        ${auPoste.length ? `<h3 class="pick-h">Au poste</h3>${auPoste.map(row).join('')}` : ''}
        <h3 class="pick-h">${auPoste.length ? 'Autres joueurs' : 'Tous les joueurs'}</h3>${autres.map(row).join('')}
      </div>
    </div>`);
}
function placer(id) {
  if (CTX.k === 'compo') {
    const m = matchEdit(CTX.id), n = CTX.n;
    const get = k => (k <= 15 ? m.tit : m.rem)[k];
    const set = (k, v) => { const o = k <= 15 ? m.tit : m.rem; if (v) o[k] = v; else delete o[k]; };
    const ancien = get(n);
    const avant = id ? Object.entries({ ...m.tit, ...m.rem }).find(([, v]) => v === id) : null;
    if (avant) set(+avant[0], ancien);
    set(n, id);
    if (m.cap && !Object.values(m.tit).includes(m.cap)) m.cap = null;
  } else {
    const j = jourEdit(CTX.d), e = j.equipes[CTX.i], ancien = e.pos[CTX.n];
    const avant = id ? Object.entries(e.pos).find(([, v]) => v === id) : null;
    j.equipes.forEach((x, i) => { if (i !== CTX.i) Object.keys(x.pos).forEach(k => { if (x.pos[k] === id) delete x.pos[k]; }); });
    if (avant) { if (ancien) e.pos[avant[0]] = ancien; else delete e.pos[avant[0]]; }
    if (id) e.pos[CTX.n] = id; else delete e.pos[CTX.n];
  }
  commit(); closeDlg(); render();
}

/* ---------- fenêtres ---------- */
function openDlg(html) {
  const d = $('#dlg'); d.innerHTML = html; d.scrollTop = 0;
  if (!d.open) d.showModal();
}
function closeDlg() { const d = $('#dlg'); if (d.open) d.close(); }

}
function formCopie(date) {
  const ds = [...new Set([...Object.keys(BJ), ...Object.keys(docs).filter(k => k.startsWith('j:')).map(k => k.slice(2))])].filter(d => d !== date && aSeance(d)).sort().reverse();
  openDlg(`<div class="dg-h"><h2>Reprendre une séance<small>Vers ${esc(dateLong(date))}</small></h2><button class="icon-btn" data-a="dlg-close" aria-label="Fermer">${ICO.x}</button></div>
    <div class="dg-b">${ds.length ? ds.map(d => { const j = jour(d); return `<button class="pick" data-a="copier-ok" data-from="${d}" data-to="${date}"><span class="nm">${esc(cap(dateLong(d)))}<br><small>S${isoWeek(d)} · ${esc(j.sections.map(s => s.type).filter(Boolean).join(', '))}</small></span></button>`; }).join('') : '<p class="h-sub">Aucune autre séance saisie.</p>'}</div>`);
}
function formReglages() {
  const nb = Object.keys(docs).length;
  const codes = `<div class="block"><div class="h-sec">Codes de présence</div><p class="h-sub"><b>P</b> Apte · <b>E</b> Espoirs · <b>B</b> Blessé · <b>A</b> Absent</p></div>`;
  const sauve = `<div class="block"><div class="h-sec"><span>Sauvegarde</span><small>${nb} élément${nb > 1 ? 's' : ''} modifié${nb > 1 ? 's' : ''}</small></div>
        <div class="acts"><button class="btn" data-a="export">Enregistrer une sauvegarde</button>${CLOUD ? '' : `
        <label class="btn" style="cursor:pointer">Restaurer une sauvegarde<input type="file" id="imp" accept="application/json,.json" style="position:absolute;opacity:0;width:1px;height:1px"></label>`}</div></div>`;
  const att = CLOUD ? clesModifiees().length : 0;

    <div class="dg-b">
    ${CLOUD ? `
      <div class="note">Connecté : <b>${esc(session.email)}</b>. Les modifications sont partagées avec tous les coachs.${att ? ` <b>${att} en attente d'envoi.</b>` : ''}</div>
      ${sauve}
      <div class="block"><button class="btn" data-a="deco">Se déconnecter</button></div>
      ${codes}` : `
      <div class="note">Tes modifications restent <b>sur cet appareil</b>, dans ce navigateur. Les autres coachs ne les voient pas. Enregistre une sauvegarde régulièrement : vider les données du navigateur les efface.</div>
      ${sauve}
      <div class="block"><div class="h-sec">Revenir au fichier Excel</div><p class="h-sub" style="margin-bottom:8px">Efface toutes les modifications faites dans l'appli sur cet appareil.</p><button class="btn dng" data-a="reset" ${nb ? '' : 'disabled'}>Tout effacer</button></div>
      ${codes}`}
    </div>`);
}

/* ---------- actions ---------- */
function curDate() { const p = location.hash.slice(1).split('/'); return p[1]; }
const A = {
  joueur: el => ficheJoueur(el.dataset.id),
  'dlg-close': () => { closeDlg(); if (pendingRender) rendreSiPossible(); },
  onglet: el => { location.hash = `#seances/${el.dataset.d}/${el.dataset.o}`; },
  'edit-on': () => { V.edit = true; render(); },
  'edit-off': () => { const d = curDate(); V.edit = false; const j = docs['j:' + d]; if (j) { j.sections.forEach(s => { s.lignes = s.lignes.filter(l => l.theme || l.contenu || l.work != null || l.rest != null); }); j.sections = j.sections.filter(s => s.lignes.length || s.type); } commit(); render(); },
  copier: el => formCopie(el.dataset.d),
  'copier-ok': el => {
    const { from, to } = el.dataset, cible = jour(to);
    if (cible && cible.sections.length && !confirm(`Remplacer la séance du ${dateLong(to)} ?`)) return;
    const src = clone(jour(from)), j = jourEdit(to);
    j.debut = src.debut; j.sections = src.sections;
    commit('Séance reprise'); closeDlg(); render();
  },
  'sec-add': el => { const j = jourEdit(curDate()); j.sections.push({ type: el.dataset.t, lignes: [{ theme: '', work: null, rest: null, contenu: '' }], staff: [], contact: null, course: null }); commit(false); render(); const f = document.querySelectorAll('.e-sec'); if (f.length) f[f.length - 1].scrollIntoView({ block: 'center' }); },
  'sec-del': el => { const j = jourEdit(curDate()), s = j.sections[+el.dataset.s]; if (!confirm(`Supprimer le bloc ${s.type || ''} ?`)) return; j.sections.splice(+el.dataset.s, 1); commit('Bloc supprimé'); render(); },
  'sec-mv': el => { const j = jourEdit(curDate()), i = +el.dataset.s, k = i + +el.dataset.v; [j.sections[i], j.sections[k]] = [j.sections[k], j.sections[i]]; commit(false); render(); },
  'lig-add': el => { jourEdit(curDate()).sections[+el.dataset.s].lignes.push({ theme: '', work: null, rest: null, contenu: '' }); commit(false); render(); },
  'lig-del': el => { jourEdit(curDate()).sections[+el.dataset.s].lignes.splice(+el.dataset.l, 1); commit(false); render(); },
  'staff-add': el => { jourEdit(curDate()).sections[+el.dataset.s].staff.push({ role: '', nom: '' }); commit(false); render(); },
  'staff-del': el => { jourEdit(curDate()).sections[+el.dataset.s].staff.splice(+el.dataset.l, 1); commit(false); render(); },
  statut: el => { setStatut(el.dataset.d, el.dataset.id, el.dataset.s); commit(); render(); },
  'appel-valide': el => { const d = el.dataset.d; docs['s:' + d] = clone(etatAu(d).map); commit('Appel enregistré'); render(); },
  'fiche-st': el => { setStatut(TODAY, el.dataset.id, el.dataset.s); commit(); ficheJoueur(el.dataset.id); render(); },
  slot: el => { const id = decodeURIComponent(location.hash.split('/')[1] || ''); CTX = { k: 'compo', id, n: +el.dataset.n }; openPicker(); },
  'slot-eq': el => { CTX = { k: 'eq', d: el.dataset.d, i: +el.dataset.i, n: +el.dataset.n }; openPicker(); },
  pick: el => placer(el.dataset.id),
  'eq-add': el => { jourEdit(el.dataset.d).equipes.push({ couleur: el.dataset.c, type: '', date: el.dataset.d, pos: {} }); commit('Équipe ajoutée'); render(); },
  'eq-del': el => { if (!confirm('Retirer cette équipe ?')) return; jourEdit(el.dataset.d).equipes.splice(+el.dataset.i, 1); commit('Équipe retirée'); render(); },
  'rem-plus': el => { const m = matchEdit(el.dataset.id); m.nbRem = Math.max(8, m.nbRem || 0, ...Object.keys(m.rem).map(n => n - 15)) + 1; commit(false); render(); },
  'compo-copie': el => copier(compoTexte(match(el.dataset.id))),
  'compo-reprise': el => {
    const ms = matchs().filter(x => x.date), i = ms.findIndex(x => x.id === el.dataset.id);
    const prev = ms.slice(0, Math.max(i, 0)).reverse().find(x => Object.keys(x.tit).length);
    if (!prev) { toast('Aucune composition précédente'); return; }
    const m = match(el.dataset.id);
    if (nbCompo(m).t && !confirm(`Remplacer cette composition par celle de ${prev.j} ?`)) return;
    const e = matchEdit(el.dataset.id);
    e.tit = clone(prev.tit); e.rem = clone(prev.rem); e.cap = prev.cap;
    commit(`Composition de ${prev.j} reprise`); render();
  },
  'compo-vide': el => { if (!confirm('Vider toute la composition ?')) return; const m = matchEdit(el.dataset.id); m.tit = {}; m.rem = {}; m.cap = null; commit('Composition vidée'); render(); },
  'match-form': el => formMatch(el.dataset.id),
  'match-del': el => { if (!confirm('Supprimer ce match ?')) return; delete docs['c:' + el.dataset.id]; commit('Match supprimé'); closeDlg(); location.hash = '#compos'; render(); },
  regl: () => formReglages(),
  deco: () => {
    const n = CLOUD && session ? clesModifiees().length : 0;
    if (n && !confirm(`${n} modification${n > 1 ? 's' : ''} pas encore envoyée${n > 1 ? 's' : ''} seront perdues. Se déconnecter quand même ?`)) return;
    if (session) fetch(`${CLOUD.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: CLOUD.cle, Authorization: 'Bearer ' + session.access_token } }).catch(() => {});
    session = null;
    try { localStorage.removeItem(KEY_SESSION); } catch (e) { /* rien */ }
    viderCache();
    ecranConnexion();
  },
  export: () => {
    const blob = new Blob([JSON.stringify({ format: 'cahierU18', version: 1, date: new Date().toISOString(), docs }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `sauvegarde-cahier-U18-${TODAY}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  reset: () => { if (CLOUD) return; if (!confirm('Effacer toutes les modifications faites sur cet appareil ? Cette action est définitive.')) return; docs = {}; commit('Modifications effacées'); closeDlg(); render(); },
};
async function copier(t) {
  try { await navigator.clipboard.writeText(t); toast('Composition copiée'); }
  catch (e) {
    const x = document.createElement('textarea'); x.value = t; x.style.position = 'fixed'; x.style.opacity = '0'; document.body.append(x); x.select();
    const ok = document.execCommand('copy'); x.remove(); toast(ok ? 'Composition copiée' : 'Copie impossible', !ok);
  }
}
document.addEventListener('click', e => {
  const d = $('#dlg');
  if (d && e.target === d) { closeDlg(); if (pendingRender) rendreSiPossible(); return; }
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled && A[el.dataset.a]) A[el.dataset.a](el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'eff-q') { V.q = t.value; $('#eff-list').innerHTML = listeEffectif(); return; }
  if (t.id === 'pick-q') {
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('#pick-list .pick').forEach(b => { b.hidden = !!q && !b.dataset.q.includes(q); });
    document.querySelectorAll('#pick-list .pick-h').forEach(h => { h.hidden = !!q; });
    return;
  }
  if (!t.dataset.ed) return;
  const date = curDate(), j = jourEdit(date), f = t.dataset.ed, s = j.sections[+t.dataset.s], k = +t.dataset.l;
  if (f === 'debut') j.debut = t.value;
  else if (f === 'type') s.type = t.value;
  else if (f === 'theme' || f === 'contenu') s.lignes[k][f] = t.value;
  else if (f === 'work' || f === 'rest') s.lignes[k][f] = parseMin(t.value);
  else if (f === 'contact' || f === 'course') s[f] = t.value ? +t.value : null;
  else if (f === 'srole') s.staff[k].role = t.value;
  else if (f === 'snom') s.staff[k].nom = t.value;
  majTotaux(date);
  persistSoon();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.a2 === 'capitaine') { matchEdit(t.dataset.id).cap = t.value || null; commit(); render(); }
  if (t.dataset.a2 === 'retour') { const r = clone(retours()); if (t.value) r[t.dataset.id] = t.value; else delete r[t.dataset.id]; docs.retours = r; commit(); render(); }
  if (t.id === 'imp' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = JSON.parse(fr.result);
        if (o.format !== 'cahierU18' || typeof o.docs !== 'object' || !o.docs) throw new Error('format');
        const propre = {};
        Object.keys(o.docs).forEach(k => { if (/^(j:\d{4}-\d{2}-\d{2}|s:\d{4}-\d{2}-\d{2}|c:.+|retours)$/.test(k)) propre[k] = o.docs[k]; });
        if (!confirm(`Remplacer les données de cet appareil par cette sauvegarde (${Object.keys(propre).length} éléments) ?`)) return;
        docs = propre; commit('Sauvegarde restaurée'); closeDlg(); render();
      } catch (err) { toast("Ce fichier n'est pas une sauvegarde du cahier", true); }
    };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'f-login') { e.preventDefault(); connexion(e.target); return; }
  if (e.target.id !== 'f-match') return;
  e.preventDefault();
  const fd = new FormData(e.target), id = e.target.dataset.id;
  const vals = { j: fd.get('j').trim(), date: fd.get('date'), dom: fd.get('dom').trim(), ext: fd.get('ext').trim(), heure: fd.get('heure'), lieu: fd.get('lieu').trim() };
  if (id) Object.assign(matchEdit(id), vals);
  else { const nid = 'M' + Date.now().toString(36); docs['c:' + nid] = { id: nid, ...vals, tit: {}, rem: {}, cap: null }; commit('Match ajouté'); closeDlg(); location.hash = '#compos/' + nid; return; }
  commit(); closeDlg(); render();
});

/* ---------- affichage ---------- */
let toastT;
function toast(m, err) {
  const t = $('#toast'); if (!t) return;
  t.textContent = m; t.classList.toggle('err', !!err); t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), err ? 4000 : 1400);
}
let lastHash = null;
function render() {
  const [p, a, b] = location.hash.slice(1).split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const page = ['accueil', 'seances', 'compos', 'effectif'].includes(p) ? p : 'accueil';
  document.querySelectorAll('.nav a').forEach(x => { if (x.dataset.p === page) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
  const y = scrollY, same = lastHash === location.hash;
  const html = page === 'seances' ? pageSeances(a, b) : page === 'compos' ? pageCompos(a) : page === 'effectif' ? pageEffectif(a) : pageAccueil();
  $('#main').innerHTML = html;
  if (same) scrollTo(0, y); else scrollTo(0, 0);
  if (fk) { const n = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (n) n.focus({ preventScroll: true }); }
  lastHash = location.hash;
}
function demarrer() {
  document.body.innerHTML = `<header class="top"><img src="${window.BLASON}" alt="Castres Olympique"><div class="top-t"><b>Cahier d'entraînement</b><span>U18 Crabos · ${esc(D.saison)}${CLOUD ? ' · <em id="sync"></em>' : ''}</span></div><button class="icon-btn" data-a="regl" aria-label="Réglages">${ICO.regl}</button></header>
    <main id="main"></main>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#accueil" data-p="accueil">${ICO.accueil}Accueil</a>
      <a href="#seances" data-p="seances">${ICO.seances}Séances</a>
      <a href="#compos" data-p="compos">${ICO.compos}Compos</a>
      <a href="#effectif" data-p="effectif">${ICO.effectif}Effectif</a>
    </nav>
    <dialog id="dlg" aria-label="Fenêtre"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>`;
  majSync();
  render();
}
addEventListener('hashchange', () => { if (!D || !$('#main') || !$('#dlg')) return; closeDlg(); render(); });
// iPhone, appli installée : iOS peut placer la page sous la barre d'état tout en annonçant une marge (même correctif que la Vidéothèque)
function fixSat() {
  const app = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const inner = Math.max(innerWidth, innerHeight), scr = Math.max(screen.width, screen.height);
  if (app && inner < scr - 20) document.documentElement.style.setProperty('--sat', '0px');
  else document.documentElement.style.removeProperty('--sat');
}
fixSat(); addEventListener('resize', fixSat); addEventListener('orientationchange', () => setTimeout(fixSat, 300));
if (CLOUD && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
function boot() {
  if (!CLOUD) {
    docs = lireJSON(KEY) || {};
    initDonnees(window.CAHIER);
    demarrer();
    return;
  }
  session = lireJSON(KEY_SESSION);
  if (session && session.access_token) ouvrir().catch(() => ecranBlocage('Pas de connexion', 'Impossible de joindre le serveur.'));
  else ecranConnexion();
}
boot();
